[pytest]
pythonpath = src
testpaths  = tests
markers =
    lent: test de solveur à gros budget (plusieurs secondes) — exécuté par
        défaut avec toute la suite ; le marqueur permet de les lancer ou de
        les isoler à part (``-m lent`` / ``-m "not lent"``) sans jamais les
        exclure par défaut (issue #210, voir CONTEXTE.md).
