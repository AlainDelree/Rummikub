<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8"><title>Rummikub</title>
  <link rel="stylesheet" href="commun.css">
  <link rel="stylesheet" href="jeu.css">
</head>
<body>

  <!-- Barre supérieure -->
  <div id="barre-top">
    <button id="btn-retour">← Retour au menu</button>
  </div>

  <!-- Corps : 2 colonnes -->
  <div id="corps-jeu">

    <!-- Colonne gauche -->
    <div id="colonne-gauche">
      <div id="fiches-joueurs"></div>
      <details id="details-historique">
        <summary>Derniers coups (<span id="nb-coups">0</span>)</summary>
        <div id="liste-historique"></div>
      </details>
      <div id="compteur-pioche"></div>
    </div>

    <!-- Colonne droite : plateau + zone de travail -->
    <div id="colonne-droite">
      <div id="zone-plateau">
        <!-- combinaisons du tapis générées dynamiquement -->
      </div>

      <div id="zone-travail">
        <div class="travail-label">Zone de pose</div>
        <div class="rangee-travail" data-rangee="0">
          <div class="rangee-indicateur actif" data-rangee="0">1</div>
          <div class="rangee-tuiles" data-rangee="0"></div>
          <button class="btn-vider-rangee" data-rangee="0" title="Vider">✕</button>
        </div>
        <div class="rangee-travail" data-rangee="1">
          <div class="rangee-indicateur" data-rangee="1">2</div>
          <div class="rangee-tuiles" data-rangee="1"></div>
          <button class="btn-vider-rangee" data-rangee="1" title="Vider">✕</button>
        </div>
        <div class="rangee-travail" data-rangee="2">
          <div class="rangee-indicateur" data-rangee="2">3</div>
          <div class="rangee-tuiles" data-rangee="2"></div>
          <button class="btn-vider-rangee" data-rangee="2" title="Vider">✕</button>
        </div>
        <div class="rangee-travail" data-rangee="3">
          <div class="rangee-indicateur" data-rangee="3">4</div>
          <div class="rangee-tuiles" data-rangee="3"></div>
          <button class="btn-vider-rangee" data-rangee="3" title="Vider">✕</button>
        </div>
      </div>

      <div id="resultat-calcul"></div>
    </div>

  </div>

  <!-- Chevalet -->
  <div id="zone-chevalet">
    <div id="chevalet-entete">
      <span id="mes-tuiles-label">Mes tuiles — cliquez, réarrangez</span>
    </div>
    <div id="chevalet"></div>
    <div id="chevalet-hint"></div>
  </div>

  <!-- Barre d'actions -->
  <div id="barre-actions">
    <button id="btn-annuler" disabled>✕ Annuler</button>
    <button id="btn-verifier-calc">🔍 Vérifier et calculer</button>
    <button id="btn-jouer" disabled>✓ Jouer</button>
    <button id="btn-piocher">⬇ Piocher</button>
    <button id="btn-trier">Trier</button>
  </div>

  <!-- Overlay fin de manche -->
  <div id="overlay-fin" class="overlay-cache">
    <div class="carte">
      <h2 id="titre-fin"></h2>
      <table id="tableau-scores"></table>
      <button id="btn-nouvelle-manche" class="btn-primaire">Nouvelle manche</button>
      <button id="btn-fin-retour" class="btn-primaire">Retour au menu</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="genres.js"></script>
  <script src="commun.js"></script>
  <script src="jeu.js"></script>
</body></html>
