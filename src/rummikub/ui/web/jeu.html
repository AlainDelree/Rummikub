<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8"><title>Rummikub</title>
  <link rel="stylesheet" href="commun.css">
  <link rel="stylesheet" href="jeu.css">
</head>
<body>

  <!-- Barre supérieure -->
  <div id="barre-top">
    <button id="btn-retour">← Retour au menu</button>
    <!-- Numéro de la manche en cours, affiché seulement si le match en
         compte plusieurs (issue #203). -->
    <span id="indicateur-manche" hidden></span>
  </div>

  <!-- Corps : 2 colonnes -->
  <div id="corps-jeu">

    <!-- Colonne gauche -->
    <div id="colonne-gauche">
      <div id="fiches-joueurs"></div>
      <button type="button" id="btn-rejouer-coup-ia"
              class="btn-rejouer-coup-ia" disabled>
        ▶ Dernier coup joué par l'ordinateur
      </button>
      <!-- Résumé écrit du dernier coup de l'IA (issue #189, suite de
           #144/#149) : phrase(s) en français calculées côté Python à partir
           du plateau avant/après (voir moteur/description_coup.py),
           affichées telles quelles, sans jamais modifier l'état de la partie. -->
      <div id="resume-coup-ia" class="resume-coup-ia"></div>
      <button type="button" id="btn-pas-a-pas-coup-ia"
              class="btn-pas-a-pas-coup-ia" disabled hidden>
        📋 Pas à pas
      </button>
      <div id="vitesse-rejeu-ia" role="group" aria-label="Vitesse du rejeu du dernier coup"
           title="Vitesse du rejeu du dernier coup">
        <span class="vitesse-rejeu-icone" aria-hidden="true">⏱</span>
        <button type="button" class="btn-vitesse-rejeu" data-vitesse="Lente">Lente</button>
        <button type="button" class="btn-vitesse-rejeu" data-vitesse="Moyenne">Moyenne</button>
        <button type="button" class="btn-vitesse-rejeu" data-vitesse="Rapide">Rapide</button>
      </div>
      <div id="compteur-pioche"></div>
      <div id="legende-couleurs"></div>
    </div>

    <!-- Colonne droite : plateau + zone de travail -->
    <div id="colonne-droite">
      <!-- Tapis : wrapper non scalé (porte le contrôle de zoom + la zone de
           défilement) ; seul #zone-plateau reçoit le transform: scale (issue #92) -->
      <div id="zone-plateau-wrap">
        <div id="zoom-tapis" role="group" aria-label="Zoom du tapis" title="Zoom du tapis (n'affecte que le tapis)">
          <span class="zoom-icone" aria-hidden="true">🔍</span>
          <button type="button" class="btn-zoom actif" data-zoom="1">100%</button>
          <button type="button" class="btn-zoom" data-zoom="0.75">75%</button>
          <button type="button" class="btn-zoom" data-zoom="0.5">50%</button>
        </div>
        <div id="zone-plateau-scroll">
          <div id="zone-plateau">
            <!-- combinaisons du tapis générées dynamiquement -->
          </div>
        </div>
      </div>

      <div id="zone-travail">
        <div class="travail-label">Zone de pose</div>
        <!-- 2 zones de pose côte à côte (issue #128 : réduit de 4 à 2, le
             bouton « Placer » de chacune transfère directement sur le tapis). -->
        <div class="travail-grille">
          <div class="rangee-travail" data-rangee="0">
            <div class="rangee-indicateur actif" data-rangee="0">1</div>
            <button class="btn-trier-rangee" data-rangee="0" title="Trier cette rangée par valeur">↕</button>
            <div class="rangee-tuiles" data-rangee="0"></div>
            <button class="btn-placer-rangee" data-rangee="0" title="Placer ces tuiles sur le tapis">⬆ Placer</button>
            <button class="btn-vider-rangee" data-rangee="0" title="Vider">✕</button>
          </div>
          <div class="rangee-travail" data-rangee="1">
            <div class="rangee-indicateur" data-rangee="1">2</div>
            <button class="btn-trier-rangee" data-rangee="1" title="Trier cette rangée par valeur">↕</button>
            <div class="rangee-tuiles" data-rangee="1"></div>
            <button class="btn-placer-rangee" data-rangee="1" title="Placer ces tuiles sur le tapis">⬆ Placer</button>
            <button class="btn-vider-rangee" data-rangee="1" title="Vider">✕</button>
          </div>
        </div>
      </div>

      <div id="resultat-calcul"></div>
    </div>

  </div>

  <!-- Chevalet -->
  <div id="zone-chevalet">
    <div id="chevalet"></div>
    <div id="chevalet-hint"></div>
  </div>

  <!-- Barre d'actions -->
  <div id="barre-actions">
    <button id="btn-annuler" disabled>✕ Annuler</button>
    <button id="btn-verifier-calc">🔍 Vérifier et calculer</button>
    <button id="btn-jouer" disabled>✓ Jouer</button>
    <button id="btn-piocher" disabled>⬇ Piocher</button>
    <button id="btn-trier">Trier</button>
    <label id="label-tri-auto"><input type="checkbox" id="chk-tri-auto"> Tri automatique</label>
  </div>

  <!-- Overlay fin de manche (manche intermédiaire, non-finale) : scores de
       la manche + accès à la suite. Quand la manche est la dernière de la
       partie, cet overlay est sauté au profit direct du classement final
       ci-dessous (issue #141), pour éviter un message redondant. -->
  <div id="overlay-fin" class="overlay-cache">
    <div class="carte">
      <h2 id="titre-fin"></h2>
      <table id="tableau-scores"></table>
      <button id="btn-nouvelle-manche" class="btn-primaire">Manche suivante</button>
      <button id="btn-fin-retour" class="btn-primaire">Retour au menu</button>
    </div>
  </div>

  <!-- Overlay classement final (fin de partie) : rang par score_cumul,
       avec animation de feu d'artifice (issue #141) -->
  <div id="overlay-classement" class="overlay-cache">
    <div class="feu-artifice" id="feu-artifice" aria-hidden="true"></div>
    <div class="carte">
      <h2 id="titre-classement"></h2>
      <table id="tableau-classement"></table>
      <button id="btn-classement-retour" class="btn-primaire">Retour à l'accueil</button>
    </div>
  </div>

  <!-- Confirmation avant rejeu du dernier coup IA, si le tour en cours
       d'Alain a des tuiles non validées à remettre en main (issue #147) -->
  <div id="overlay-confirm-rejeu" class="overlay-cache">
    <div class="carte carte-confirm">
      <h2 id="titre-confirm-rejeu"></h2>
      <p id="texte-confirm-rejeu">Vos tuiles pas encore validées pour ce tour
        seront remises en main pour laisser la place au rejeu — continuer ?</p>
      <div class="boutons-confirm">
        <button id="btn-confirm-rejeu-non" class="btn-secondaire">Annuler</button>
        <button id="btn-confirm-rejeu-oui" class="btn-primaire">Continuer</button>
      </div>
    </div>
  </div>

  <!-- Rejeu pas-à-pas du dernier coup complexe de l'IA (issue #189, suite
       de #144/#149) : lecture seule, piloté entièrement par le joueur
       (Précédent/Suivant), ne modifie jamais l'état de la partie. N'est
       proposé que si le coup touche au moins 2 étapes distinctes (voir
       rafraichirBoutonRejouerIA). -->
  <div id="overlay-pas-a-pas" class="overlay-cache">
    <div class="carte carte-pas-a-pas">
      <h2 id="titre-pas-a-pas">Rejeu pas à pas</h2>
      <!-- Ligne d'ampleur du coup (issue #207, point 3) : « Coup de grande
           taille : N tuiles du plateau déplacées, N combinaisons modifiées,
           N tuiles posées depuis la main ». Renseignée par majLigneTaillePasAPas
           à partir de coup.mesure. -->
      <p id="ligne-taille-pas-a-pas" class="ligne-taille-pas-a-pas"></p>
      <!-- Deux modes de consultation (issue #207) : le découpage en étapes
           (condensé par défaut, « Détailler » pour le tuile-par-tuile) et la
           bascule « Avant / Après » (comparaison du plateau, lecture seule). -->
      <div id="controles-pas-a-pas" class="controles-pas-a-pas">
        <button type="button" id="btn-pas-a-pas-detailler" class="btn-mode-pas-a-pas">Détailler</button>
        <button type="button" id="btn-pas-a-pas-comparaison" class="btn-mode-pas-a-pas">Avant / Après</button>
      </div>

      <!-- Vue « étapes » -->
      <div id="vue-etapes-pas-a-pas">
        <p id="soustitre-etape-pas-a-pas" class="soustitre-etape-pas-a-pas"></p>
        <p id="texte-etape-pas-a-pas" class="texte-etape-pas-a-pas"></p>
        <!-- Cadre « tuiles à placer » (issue #191) : au-dessus de l'aperçu du
             plateau, contient les tuiles pas encore reposées (venues de la
             main ou libérées du plateau) ; vide à la toute dernière étape. -->
        <div id="zone-cadre-pas-a-pas" class="zone-cadre-pas-a-pas">
          <div class="cadre-label">Tuiles à placer</div>
          <div id="cadre-tuiles-pas-a-pas" class="cadre-tuiles-pas-a-pas"></div>
        </div>
        <div id="zone-plateau-pas-a-pas" class="zone-plateau-pas-a-pas"></div>
        <div class="boutons-pas-a-pas">
          <button type="button" id="btn-pas-a-pas-precedent" class="btn-secondaire">← Précédent</button>
          <span id="compteur-etape-pas-a-pas" class="compteur-etape-pas-a-pas"></span>
          <button type="button" id="btn-pas-a-pas-suivant" class="btn-primaire">Suivant →</button>
        </div>
      </div>

      <!-- Vue « Avant / Après » (issue #207, point 4) : comparaison en lecture
           seule du plateau avant et après le coup, combinaisons modifiées ou
           créées mises en évidence, tuiles distinguées selon leur origine. -->
      <div id="vue-comparaison-pas-a-pas" hidden>
        <div class="comparaison-colonnes">
          <div class="comparaison-colonne">
            <div class="comparaison-titre">Avant le coup</div>
            <div id="comparaison-avant" class="zone-plateau-pas-a-pas comparaison-plateau"></div>
          </div>
          <div class="comparaison-colonne">
            <div class="comparaison-titre">Après le coup</div>
            <div id="comparaison-apres" class="zone-plateau-pas-a-pas comparaison-plateau"></div>
          </div>
        </div>
        <!-- Légende illustrée (issue #214, point 5c) : chaque repère contient
             un vrai exemple — UNE tuile dans le repère vert/orange, TROIS
             tuiles côte à côte dans le repère bleu — pour qu'on comprenne d'un
             coup d'œil que les deux premiers marquent UNE tuile et le troisième
             UNE combinaison. Peuplée par construireLegendePasAPas(). -->
        <div id="legende-pas-a-pas" class="legende-pas-a-pas"></div>
      </div>

      <button type="button" id="btn-pas-a-pas-quitter" class="btn-secondaire btn-pas-a-pas-quitter">
        Quitter le pas à pas
      </button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="genres.js"></script>
  <script src="commun.js"></script>
  <script src="jeu.js"></script>
</body></html>
