<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <title>Rummikub</title>
  <link rel="stylesheet" href="commun.css">
  <link rel="stylesheet" href="accueil.css">
</head>
<body>
  <div class="carte" id="carte-principale">
    <button id="btn-reglages" title="Réglages">⚙</button>

    <div id="titre-container" class="titre-tuiles"></div>

    <!-- Section joueurs : humain + IA ensemble -->
    <section id="section-joueurs">
      <div id="label-joueurs" class="section-label titre-tuiles"></div>
      <div id="liste-joueurs">
        <!-- carte humain en premier, puis cartes IA -->
      </div>
      <!-- Boutons de niveau : cliquer ajoute un adversaire de ce niveau -->
      <div id="boutons-ajout-niveau">
        <span id="label-ajout">Ajouter un adversaire :</span>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Débutant">Débutant</button>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Facile">Facile</button>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Intermédiaire">Intermédiaire</button>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Avancé">Avancé</button>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Expert">Expert</button>
        <button class="btn-niveau btn-ajout-niveau" data-niveau="Champion du Monde">Champion du Monde</button>
      </div>
    </section>

    <!-- Section parties sauvegardées -->
    <section id="section-parties">
      <div class="section-label titre-tuiles" id="label-parties"></div>
      <div id="liste-parties"></div>
    </section>

    <!-- Nombre de manches du match (issue #205) : choix propre à chaque partie,
         compact, juste au-dessus du bouton Lancer (même style que « Ajouter
         un adversaire : »). Mémorisé sous la clé nb_manches. -->
    <div id="choix-manches">
      <label id="label-manches" for="acc-manches">Nombre de manches :</label>
      <select id="acc-manches">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
      </select>
    </div>

    <button id="btn-lancer" class="btn-primaire">Lancer la partie</button>
  </div>

  <!-- Overlay réglages (masqué par défaut) -->
  <div id="overlay-reglages" class="overlay-cache">
    <div class="carte">
      <h2>Réglages</h2>
      <div class="onglets">
        <button class="onglet actif" data-onglet="general">Général</button>
        <button class="onglet" data-onglet="regles">Règles du jeu</button>
      </div>
      <div id="panneau-general" class="panneau-onglet">
        <label>Prénom principal<br>
          <input type="text" id="rgl-prenom" maxlength="20"></label>
        <div>Votre avatar</div>
        <div id="grille-avatars"></div>
        <div>Réorganisation du chevalet<br>
          <label><input type="radio" name="mode-reorg" value="clic" checked>
            Appui long + clic</label>
          <label><input type="radio" name="mode-reorg" value="drag">
            Glisser-déposer</label>
        </div>
        <label>Vitesse de l'ordinateur<br>
          <select id="rgl-vitesse">
            <option>Instantanée</option><option>Rapide</option>
            <option selected>Normale</option><option>Lente</option>
          </select></label>
        <label><input type="checkbox" id="rgl-ia-auto">
          Jouer automatiquement le tour de l'ordinateur</label>
        <label><input type="checkbox" id="rgl-dezoom-auto" checked>
          Dé-zoomer automatiquement le tapis quand il déborde</label>
      </div>
      <div id="panneau-regles" class="panneau-onglet cache">
        <label><input type="checkbox" id="rgl-mise30" checked>
          Mise initiale 30 pts minimum</label>
        <div>Valeur joker en pénalité<br>
          <label><input type="radio" name="joker-val" value="25"> 25 pts</label>
          <label><input type="radio" name="joker-val" value="30" checked> 30 pts</label>
        </div>
      </div>
      <button id="btn-fermer-rgl" class="btn-primaire" style="margin-top:16px">Fermer</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="genres.js"></script>
  <script src="commun.js"></script>
  <script src="accueil.js"></script>
</body></html>
